name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check:quick

  full-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/zephyr
          key: zephyr-${{ runner.os }}-${{ hashFiles('zephyr.lock.json') }}
      - run: npm ci
      - run: npm run check

  extended-toolchain:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:extended
