name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:quick

  full-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache/zephyr
          key: zephyr-${{ runner.os }}-node-24-schema-5-${{ hashFiles('zephyr.lock.json', 'package-lock.json') }}
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: npm run fetch:zephyr
      - run: python -m pip install -r .cache/zephyr/scripts/requirements-base.txt
      - run: npm run check

  extended-toolchain:
    # Release gate. Manual runs stay available; a tagged build cannot skip it.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/cache@v6
        with:
          path: .cache
          key: zephyr-west-${{ runner.os }}-node-24-schema-5-${{ hashFiles('zephyr.lock.json', 'package-lock.json') }}
      - name: Install semantic and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build doxygen device-tree-compiler gperf ccache
          npm run fetch:zephyr
          python -m pip install -r .cache/zephyr/scripts/requirements-base.txt
          npm run fetch:modules
      - name: Install and verify pinned Zephyr SDK
        env:
          SDK_VERSION: 1.0.1
        run: |
          archive="zephyr-sdk-${SDK_VERSION}_linux-x86_64_gnu.tar.xz"
          url="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}"
          curl --fail --location --output "$RUNNER_TEMP/$archive" "$url/$archive"
          curl --fail --location --output "$RUNNER_TEMP/sha256.sum" "$url/sha256.sum"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing sha256.sum
          tar -xf "$archive"
          "$RUNNER_TEMP/zephyr-sdk-${SDK_VERSION}/setup.sh" -t all -h -c
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "$GITHUB_ENV"
          echo "ZEPHYR_SDK_INSTALL_DIR=$RUNNER_TEMP/zephyr-sdk-${SDK_VERSION}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check:release
